name: Build and test
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.7.0
      - name: Check repository contents
        run: python3 scripts/maintenance/check-repository.py
      - name: Check contribution automation
        run: python3 scripts/maintenance/test-contribution.py
      - name: Download and verify the frozen SDK
        run: node scripts/maintenance/bootstrap.mjs
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm exec tsx --test 'test/*.test.ts'
