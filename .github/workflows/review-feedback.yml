name: CoNest Review Feedback

on:
  workflow_run:
    workflows: [CoNest Review]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download reviewed report only
        uses: actions/download-artifact@v4
        with:
          name: conest-review
          path: review
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish one head-specific review comment
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: review/review.md
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- conest-review:v1 -->';
            const pull_number = context.payload.workflow_run.pull_requests[0].number;
            const body = fs.readFileSync(process.env.REVIEW_FILE, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pull_number,
              per_page: 100,
            });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pull_number, body });
            }
