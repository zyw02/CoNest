name: macOS integration
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CONEST_REPORT_PROFILE: macos-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Record native environment
        run: |
          sw_vers
          node -e 'const target = `${process.platform}-${process.arch}`; if (target !== process.argv[1]) throw Error(`Expected ${process.argv[1]}, got ${target}`)' '${{ matrix.target }}'
      - run: npm install --global pnpm@11.7.0
      - run: node scripts/maintenance/bootstrap.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build target archive and Unix installer
        run: |
          node scripts/prepare-native.mjs --target '${{ matrix.target }}' --out "$RUNNER_TEMP/native"
          node scripts/pack-release.mjs --target '${{ matrix.target }}' --native-dir "$RUNNER_TEMP/native" --out "$RUNNER_TEMP/package"
          node scripts/pack-unix.mjs --target '${{ matrix.target }}' --archive "$RUNNER_TEMP/package/local-conest-connector-0.6.4.tgz" --out "$RUNNER_TEMP"
      - name: Verify isolated archive installation and local service lifecycle
        run: node scripts/test-installation.mjs "$RUNNER_TEMP/package/local-conest-connector-0.6.4.tgz" --host-enhancements
      - name: Verify bundled macOS installer and deterministic Gateway
        run: |
          CONEST_INSTALL_ROOT="$RUNNER_TEMP/conest-installed" bash "$RUNNER_TEMP/conest-0.6.4-${{ matrix.target }}/install.sh"
          CONEST_NATIVE_ROOT="$RUNNER_TEMP/conest-installed/host/node_modules/@local/conest-connector" node --test test/native-runtime.test.mjs
          "$RUNNER_TEMP/conest-installed/start.sh" --components
          "$RUNNER_TEMP/conest-installed/start.sh" --verify
          "$RUNNER_TEMP/conest-installed/start.sh" --verify --core
          "$RUNNER_TEMP/conest-installed/node/node-v24.16.0-${{ matrix.target }}/bin/node" "$RUNNER_TEMP/conest-installed/host/node_modules/@local/conest-connector/dist/probe-platform.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conest-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/conest-0.6.4-${{ matrix.target }}/
            ${{ runner.temp }}/conest-installed/components-acceptance.json
            ${{ runner.temp }}/conest-installed/check-state-*/acceptance.json
            ${{ runner.temp }}/conest-installed/check-state-*/model-evidence.json
            .local/reports/macos-${{ matrix.target }}/
