name: Agent compatibility

on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main, develop]
    paths: [compatibility.json, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, 'src/**', 'test/**', 'scripts/**', '.github/workflows/compatibility.yml']
  pull_request:
    branches: [main, develop]
    paths: [compatibility.json, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, 'src/**', 'test/**', 'scripts/**', '.github/workflows/compatibility.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openclaw-versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: resolve
        name: Resolve every stable OpenClaw release since 2026.7.1
        run: echo "matrix=$(node scripts/maintenance/openclaw-matrix.mjs)" >> "$GITHUB_OUTPUT"
  openclaw:
    name: OpenClaw ${{ matrix.version }} / ${{ matrix.os }}
    needs: openclaw-versions
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        version: ${{ fromJSON(needs.openclaw-versions.outputs.matrix) }}
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.7.0
      - name: Restore verified DSH adapter SDK
        run: node scripts/maintenance/bootstrap.mjs
      - run: pnpm install --frozen-lockfile
      - name: Build once against the frozen SDK
        run: pnpm build
      - name: Select the actual runtime host without changing build pins
        run: node scripts/maintenance/select-openclaw-version.mjs "${{ matrix.version }}"
      - name: Verify adapters, activation and real Gateway execution
        env:
          CONEST_EXPECT_OPENCLAW_VERSION: ${{ matrix.version }}
          CONEST_REPORT_PROFILE: openclaw-${{ matrix.version }}
        run: node scripts/test-openclaw-matrix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openclaw-${{ matrix.version }}-${{ matrix.os }}
          path: .local/reports/openclaw-${{ matrix.version }}/
          include-hidden-files: true
          if-no-files-found: error
  dsh-versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        name: Resolve qualified and current DSH releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest_tag="$(gh api 'repos/deepseek-ai/deepseek-harness/releases?per_page=20' --jq '[.[] | select(.draft == false)][0].tag_name')"
          latest_version="${latest_tag#dsh-v}"
          latest_revision="$(gh api "repos/deepseek-ai/deepseek-harness/commits/${latest_tag}" --jq .sha)"
          node -e 'const d=require("./compatibility.json").adapters.dsh; const latest={version:process.argv[1],source:"upstream-latest",revision:process.argv[2]}; const include=d.qualifications.some(x=>x.version===latest.version)?d.qualifications:[...d.qualifications,latest]; process.stdout.write(`matrix=${JSON.stringify({include})}\n`)' "$latest_version" "$latest_revision" >> "$GITHUB_OUTPUT"
  dsh:
    needs: dsh-versions
    name: dsh (${{ matrix.version }} / ${{ matrix.source }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dsh-versions.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.7.0
      - name: Restore frozen DSH SDK
        if: matrix.source == 'frozen-sdk'
        run: node scripts/maintenance/bootstrap.mjs
      - name: Select public DSH release
        if: startsWith(matrix.source, 'upstream-')
        run: node scripts/maintenance/select-dsh-version.mjs "${{ matrix.version }}" "${{ matrix.revision }}"
      - name: Install frozen dependency graph
        if: matrix.source == 'frozen-sdk'
        run: pnpm install --frozen-lockfile
      - name: Install public DSH dependency graph
        if: startsWith(matrix.source, 'upstream-')
        run: pnpm install --lockfile=false
      - run: pnpm test:dsh-matrix
